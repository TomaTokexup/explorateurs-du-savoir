<!DOCTYPE html>
<html lang="fr">

<head>

    <meta name="theme-color" content="#23305a">
    <!-- Icône de l'onglet, et icône quand on ajoute le site à l'écran d'accueil d'une tablette -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="images/icone-180.png">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Explorateurs du Savoir">
    <meta property="og:description" content="Révisions gratuites pour les élèves de P3, P4 et P5 de la section française des Écoles européennes : maths, français, anglais, découverte du monde et initiation à la programmation.">

    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<!-- data-page : indique au script quelle page il doit construire -->
<body data-page="niveau">
    <main class="page">
        <a class="retour" href="index.html">← Changer de classe</a>

        <header class="entete">
            <h1 id="titre-niveau">Mes cahiers</h1>
            <p>Choisis un cahier pour commencer à réviser.</p>
        </header>

        <!-- Rempli par script.js : un cahier par matière -->
        <ul class="cahiers" id="liste-cahiers"></ul>
        <p class="progression" id="progression"></p>
    </main>

    <script src="script.js"></script>
</body>

</html>
