<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorateurs du Savoir</title>
    <!-- Polices : Fredoka pour les titres, Andika (conçue pour les jeunes lecteurs) pour le texte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <header class="entete">
            <h1>Explorateurs du Savoir</h1>
            <p>Bienvenue, jeune explorateur ! Choisis un cahier pour commencer à réviser.</p>
        </header>

        <!-- Chaque matière est un "cahier". Les matières prêtes sont des liens <a>,
             les autres sont de simples <div> avec le tampon "Bientôt". -->
        <ul class="cahiers">
            <li>
                <a class="cahier maths" href="maths.html">
                    <span class="etiquette"><span class="icone">🔢</span><span class="nom">Mathématiques</span></span>
                </a>
            </li>
            <li>
                <div class="cahier francais bientot">
                    <span class="etiquette"><span class="icone">📖</span><span class="nom">Français</span></span>
                    <span class="tampon">Bientôt</span>
                </div>
            </li>
            <li>
                <div class="cahier anglais bientot">
                    <span class="etiquette"><span class="icone">💬</span><span class="nom">Anglais</span></span>
                    <span class="tampon">Bientôt</span>
                </div>
            </li>
            <li>
                <div class="cahier histoire bientot">
                    <span class="etiquette"><span class="icone">🏰</span><span class="nom">Histoire</span></span>
                    <span class="tampon">Bientôt</span>
                </div>
            </li>
            <li>
                <div class="cahier geographie bientot">
                    <span class="etiquette"><span class="icone">🗺️</span><span class="nom">Géographie</span></span>
                    <span class="tampon">Bientôt</span>
                </div>
            </li>
            <li>
                <div class="cahier physique bientot">
                    <span class="etiquette"><span class="icone">⚡</span><span class="nom">Physique</span></span>
                    <span class="tampon">Bientôt</span>
                </div>
            </li>
            <li>
                <div class="cahier svt bientot">
                    <span class="etiquette"><span class="icone">🌱</span><span class="nom">Sciences naturelles</span></span>
                    <span class="tampon">Bientôt</span>
                </div>
            </li>
            <li>
                <div class="cahier programmation bientot">
                    <span class="etiquette"><span class="icone">🤖</span><span class="nom">Programmation</span></span>
                    <span class="tampon">Bientôt</span>
                </div>
            </li>
        </ul>
    </main>
</body>

</html>
