# Recette GitHub Actions : à chaque push (et à chaque pull request),
# GitHub vérifie automatiquement toutes les banques de questions.
name: Vérifier les questions et tester le site

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest        # une machine Linux prêtée par GitHub
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Vérifier toutes les banques de questions
        run: python outils/verifier_tout.py

  
  tester-le-site:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer pytest et Playwright
        run: pip install -r requirements-tests.txt

      - name: Installer le navigateur Chromium
        run: python -m playwright install --with-deps chromium

      - name: Lancer les tests du site
        run: python -m pytest